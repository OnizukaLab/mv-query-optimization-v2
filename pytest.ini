[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: Integration tests (may require database)
    performance: Performance tests (slow)
    slow: Slow running tests
    unit: Unit tests (fast)

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html

[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */.venv/*
    */anaconda/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    pass

precision = 2
show_missing = True

[coverage:html]
directory = htmlcov
